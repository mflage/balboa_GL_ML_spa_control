esphome:
  name: hottub

esp8266:
  board: d1_mini_lite

logger:
  baud_rate: 0  # UART0 is used for the tub
api:
ota:
  - platform: esphome
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

external_components:
  - source: github://mflage/balboa_GL_ML_spa_control
    components: [balboa_gl]

uart:
  id: tub_uart
  rx_pin: GPIO3
  tx_pin: GPIO1
  baud_rate: 115200

balboa_gl:
  id: tub
  uart_id: tub_uart
  panel_select_pin: GPIO4   # topside connector pin 5
  flow_control_pin: GPIO5   # MAX485 DE/RE

climate:
  - platform: balboa_gl
    name: Hot tub

select:
  - platform: balboa_gl
    pump1: {name: Pump 1, dual_speed: true}
    pump2: {name: Pump 2}
    aux: {name: Aux}
    mode: {name: Mode}

switch:
  - platform: balboa_gl
    light: {name: Hot tub light}

binary_sensor:
  - platform: balboa_gl
    heater: {name: Heater}

text_sensor:
  - platform: balboa_gl
    status: {name: Status}
